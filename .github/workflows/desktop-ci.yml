name: Desktop CI

on:
  pull_request:
    branches: [Entwicklung-App]
  push:
    branches:
      - Entwicklung-App
      - 'feature/**'
      - '22-automatisches-update-system-mit-github-releases-und-in-app-updatebenachrichtigung'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.17'
      - name: Install locked JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned Python test environment
        run: |
          python -m pip install --only-binary=:all: pip==26.1.2
          python -m pip install --only-binary=:all: -r requirements-ci.txt
      - name: Validate development version and JavaScript
        # Never classify ordinary CI as a stable release build.
        shell: bash
        run: |
          unset TTC_DESKTOP_RELEASE_TAG
          npm run desktop:version
          npm run desktop:check
      - name: Python tests
        run: python -m pytest -q --basetemp "${{ runner.temp }}/ttc-pytest"
      - name: Preserve lifecycle diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-test-diagnostics-${{ matrix.os }}
          path: ${{ runner.temp }}/ttc-pytest/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  windows-build:
    name: Windows NSIS x64 build
    needs: tests
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.17'
      - run: npm ci --no-audit --no-fund
      - run: |
          python -m pip install --only-binary=:all: pip==26.1.2
          python -m pip install --only-binary=:all: -r requirements-ci.txt
      - name: Prepare embedded Windows Python
        run: python scripts/prepare_windows_runtime.py dist/python-windows
      - name: Compile complete development installer
        shell: bash
        run: |
          unset TTC_DESKTOP_RELEASE_TAG
          npm run desktop:installer:win
          node scripts/check_installer.cjs
      - name: Native installer process and Shell hooks
        shell: pwsh
        run: ./scripts/check_native_installer_hooks.ps1
      - name: Packaged Python migrations and backend lifecycle
        shell: pwsh
        run: |
          $appRoot = (Resolve-Path 'dist/windows/TT Rechnungsverwaltung-win32-x64/resources/app').Path
          $env:TTC_WINDOWS_PYTHON = Join-Path $appRoot 'runtime/python/python.exe'
          python -m pytest -q tests/test_windows_runtime.py

  linux-build:
    name: Linux AppImage x64 build
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.17'
      - run: npm ci --no-audit --no-fund
      - run: |
          python -m pip install --only-binary=:all: pip==26.1.2
          python -m pip install --only-binary=:all: -r requirements-ci.txt
      - name: Prepare embedded Linux Python
        run: python scripts/prepare_linux_runtime.py dist/python-linux
      - name: Build complete development AppImage
        shell: bash
        run: |
          unset TTC_DESKTOP_RELEASE_TAG
          npm run desktop:build:linux
      - name: Extract AppImage without FUSE
        shell: bash
        run: |
          mkdir -p dist/appimage-smoke
          cd dist/appimage-smoke
          ../appimage/*-development.AppImage --appimage-extract > /dev/null
      - name: Packaged Python migrations and backend lifecycle
        run: |
          node scripts/check_appimage.cjs dist/appimage-smoke/squashfs-root
          export TTC_LINUX_PYTHON="$PWD/dist/appimage-smoke/squashfs-root/resources/app/runtime/python/bin/python3.13"
          python -m pytest -q tests/test_linux_runtime.py tests/test_windows_runtime.py
