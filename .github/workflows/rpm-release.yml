name: RPM Repository Release

on:
  push:
    tags: ['rpm-v*']

permissions:
  contents: read

# One publication includes the Pages deployment. Never cancel an in-flight update.
concurrency:
  group: rpm-production-repository
  cancel-in-progress: false

env:
  TTC_RPM_RELEASE_TAG: ${{ github.ref_name }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  build:
    name: Verify authorization and build source-bound RPM
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      revision: ${{ steps.revision.outputs.value }}
    permissions:
      contents: read
      actions: read
      deployments: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.17'
      - id: revision
        name: Read RPM revision
        run: |
          revision="${TTC_RPM_RELEASE_TAG##*-}"
          [[ "$revision" =~ ^[1-9][0-9]*$ ]]
          echo "value=$revision" >> "$GITHUB_OUTPUT"
          echo "TTC_RPM_RELEASE_NUMBER=$revision" >> "$GITHUB_ENV"
      - run: node scripts/rpm_gate.cjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DESKTOP_POLICY_READ_TOKEN: ${{ secrets.DESKTOP_POLICY_READ_TOKEN }}
      - run: npm ci --no-audit --no-fund
      - run: python scripts/prepare_linux_runtime.py dist/python-linux
      - name: Build stable RPM in pinned Fedora environment
        run: |
          docker build -t ttc-rpm-tools -f build/linux/rpm/Containerfile build/linux/rpm
          docker run --rm -v "$PWD:/work" -w /work \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/work \
            -e TTC_RPM_RELEASE_TAG -e TTC_RPM_RELEASE_NUMBER \
            ttc-rpm-tools node scripts/rpm_package.cjs dist/rpm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm-unsigned
          path: dist/rpm/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Approve, sign and publish RPM release
    needs: build
    runs-on: ubuntu-24.04
    environment: rpm-repository
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      deployments: read
      pages: read
    env:
      TTC_RPM_RELEASE_NUMBER: ${{ needs.build.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rpm-unsigned
          path: dist/rpm-input
      - run: docker build -t ttc-rpm-tools -f build/linux/rpm/Containerfile build/linux/rpm
      - name: Verify source, sign with separate RPM key, verify uploads, publish last
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/work \
            -e GITHUB_TOKEN -e DESKTOP_POLICY_READ_TOKEN -e RPM_REPOSITORY_PRIVATE_KEY \
            -e GITHUB_EVENT_NAME -e GITHUB_REF_TYPE -e GITHUB_REF_NAME -e GITHUB_REPOSITORY \
            -e TTC_RPM_RELEASE_TAG -e TTC_RPM_RELEASE_NUMBER \
            ttc-rpm-tools node scripts/publish_rpm.cjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DESKTOP_POLICY_READ_TOKEN: ${{ secrets.DESKTOP_POLICY_READ_TOKEN }}
          RPM_REPOSITORY_PRIVATE_KEY: ${{ secrets.RPM_REPOSITORY_PRIVATE_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm-repository-metadata
          path: dist/rpm-signed/repository-metadata.tar.gz
          if-no-files-found: error
          retention-days: 7

  pages:
    name: Approve and deploy verified DNF metadata
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      actions: read
      deployments: read
      pages: write
      id-token: write
    env:
      TTC_RPM_RELEASE_NUMBER: ${{ needs.build.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - run: node scripts/rpm_gate.cjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DESKTOP_POLICY_READ_TOKEN: ${{ secrets.DESKTOP_POLICY_READ_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rpm-repository-metadata
          path: dist/rpm-pages-input
      - name: Verify metadata signature, pinned key and installation instructions
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.prepare_rpm_repository_site import unpack
          p = json.loads(Path('rpm-repository-policy.json').read_text())
          unpack(Path('dist/rpm-pages-input/repository-metadata.tar.gz'), Path(p['publicKeyFile']),
                 Path('dist/rpm-site'), p['keyFingerprint'], p['baseUrl'])
          PY
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/rpm-site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
