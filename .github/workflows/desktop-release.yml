name: Desktop Release

on:
  push:
    tags: ['desktop-v*']

permissions:
  contents: read

concurrency:
  group: desktop-production-release
  cancel-in-progress: false

env:
  TTC_DESKTOP_RELEASE_TAG: ${{ github.ref_name }}
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  gate:
    name: Verify release authorization
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Validate policy, tag, ancestry, protections and successful native CI
        run: node scripts/release_gate.cjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DESKTOP_POLICY_READ_TOKEN: ${{ secrets.DESKTOP_POLICY_READ_TOKEN }}

  linux:
    name: Build stable Linux AppImage
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.18'
      - run: npm ci --no-audit --no-fund
      - run: |
          python -m pip install --only-binary=:all: pip==26.1.2
          python -m pip install --only-binary=:all: -r requirements-ci.txt
      - run: python scripts/prepare_linux_runtime.py dist/python-linux
      - run: npm run desktop:build:linux
      - name: Verify stable packaged runtime
        run: |
          mkdir dist/release-smoke
          cd dist/release-smoke
          ../appimage/*.AppImage --appimage-extract > /dev/null
          cd ../..
          node scripts/check_appimage.cjs dist/release-smoke/squashfs-root
          export TTC_LINUX_PYTHON="$PWD/dist/release-smoke/squashfs-root/resources/app/runtime/python/bin/python3.13"
          python -m pytest -q tests/test_linux_runtime.py tests/test_windows_runtime.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-linux
          path: |
            dist/appimage/*.AppImage
            dist/appimage/*.AppImage.sha256
            dist/appimage/*.AppImage.release.json
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Build and sign stable Windows NSIS
    needs: gate
    runs-on: [self-hosted, Windows, X64, desktop-release-signing]
    environment: desktop-release
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.18'
      - run: npm ci --no-audit --no-fund
      - run: |
          python -m pip install --only-binary=:all: pip==26.1.2
          python -m pip install --only-binary=:all: -r requirements-ci.txt
      - run: python scripts/prepare_windows_runtime.py dist/python-windows
      - run: npm run desktop:installer:win
      - run: node scripts/check_installer.cjs
      - name: Verify signed packaged runtime
        shell: pwsh
        run: |
          $appRoot = (Resolve-Path 'dist/windows/TTC Rechnungsverwaltung-win32-x64/resources/app').Path
          $env:TTC_WINDOWS_PYTHON = Join-Path $appRoot 'runtime/python/python.exe'
          python -m pytest -q tests/test_windows_runtime.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-windows
          path: |
            dist/installer/*.exe
            dist/installer/*.exe.sha256
            dist/installer/*.exe.release.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Approve and publish complete signed release
    needs: [gate, linux, windows]
    runs-on: [self-hosted, Windows, X64, desktop-release-signing]
    environment: desktop-release
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-windows
          path: dist/release-input/windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-linux
          path: dist/release-input/linux
      - name: Reverify Authenticode, sign manifest, verify uploads and publish last
        run: node scripts/publish_desktop.cjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DESKTOP_POLICY_READ_TOKEN: ${{ secrets.DESKTOP_POLICY_READ_TOKEN }}
          DESKTOP_UPDATE_PRIVATE_KEY: ${{ secrets.DESKTOP_UPDATE_PRIVATE_KEY }}
